const DOM=[['METH','HIS','Less methyl-donor (SAM) slows histamine clearance (HNMT).','甲基供体（SAM）不足会减慢组胺清除（HNMT）。'],['METH','EST','SAM is needed for COMT to clear estrogen, so PMS and heavy periods can follow.','COMT清除雌激素需要SAM，因此可能出现经前不适、经量偏多。'],['METH','CAT','SAM is needed to break down stress chemicals (COMT, PNMT).','分解压力相关神经递质（COMT、PNMT）需要SAM。'],['METH','GSH','Homocysteine feeds the route to glutathione, so detox weakens too.','同型半胱氨酸是谷胱甘肽的上游原料，排毒能力随之减弱。'],['FOL','BH4','Folate recycles BH4, the cofactor for mood chemistry and nitric oxide.','叶酸负责回收BH4——情绪化学与一氧化氮的辅因子。'],['FOL','METH','Methylfolate donates the methyl group that makes SAM.','甲基叶酸提供合成SAM所需的甲基。'],['COB','METH','B12 is needed to turn homocysteine back into methionine.','B12负责把同型半胱氨酸转回甲硫氨酸。'],['COB','FOL','Low B12 traps folate in its methyl form (“methyl trapping”).','B12偏低会把叶酸困在甲基形式（“甲基陷阱”）。'],['BH4','CAT','BH4 is needed to make dopamine, norepinephrine and epinephrine.','BH4是合成多巴胺、去甲肾上腺素与肾上腺素的必需辅因子。'],['BH4','SER','BH4 is needed to make serotonin and melatonin.','BH4是合成血清素与褪黑素的必需辅因子。'],['GSH','HIS','Histamine breakdown creates peroxide that glutathione must clear.','组胺分解会产生过氧化物，需要谷胱甘肽来清除。'],['GSH','EST','Glutathione neutralises harmful estrogen by-products.','谷胱甘肽负责中和有害的雌激素代谢产物。'],['GSH','BH4','Glutathione keeps BH4 from being used up by oxidative stress.','谷胱甘肽防止BH4被氧化压力耗尽。'],['HIS','EST','Histamine raises estrogen and estrogen raises histamine — a vicious cycle.','组胺升高雌激素，雌激素又升高组胺——恶性循环。'],['ALD','HIS','Aldehyde clearance is the last step of histamine breakdown.','醛类清除是组胺分解的最后一步。'],['MIT','GSH','Energy-making mitochondria produce free radicals that use up glutathione.','产能的线粒体会产生自由基，消耗谷胱甘肽。'],['MIT','METH','Methylation enzymes need ATP, so low energy slows methylation.','甲基化酶需要ATP，能量不足会拖慢甲基化。'],['OXA','MIT','Oxalate interferes with mitochondria and worsens fatigue.','草酸会干扰线粒体，加重疲劳。']];

['E','Heated plastic, styrene & toluene','加热塑料、苯乙烯与甲苯','Styrofoam and plastic containers (especially heated), paints, nail polish, petrol fumes.','泡沫塑料和塑料容器（尤其加热时）、油漆、指甲油、汽油挥发气体。','Styrene and toluene are cleared with glycine and B5, and heated plastics also leach hormone disruptors.','苯乙烯和甲苯需要甘氨酸和B5来清除，加热的塑料还会释放激素干扰物。',['GSH','EST'],['Gly','B5'],'Never heat food in plastic or Styrofoam, use glass or ceramic, and ventilate when using solvents.','切勿用塑料或泡沫塑料加热食物，改用玻璃或陶瓷；使用溶剂时保持通风。'],
['E','Chlorine & water by-products','氯与水消毒副产物','Tap water, swimming pools, hot showers, bleach and some cleaning products.','自来水、泳池、热水淋浴、漂白剂和部分清洁产品。','Chlorine and its by-products (such as dichloroacetic acid) tax the B12 and methylation pathways.','氯及其副产物（如二氯乙酸）加重B12与甲基化通路的负担。',['COB','METH'],['B12','B2'],'Use a chlorine filter for drinking water and showers, and ventilate when cleaning.','饮用水和淋浴使用除氯滤水器，清洁时保持通风。'],
['E','Nitrous oxide (laughing gas)','笑气（一氧化二氮）','Dental procedures and some hospital wards.','牙科治疗和部分医院病房。','Inactivates B12 — most important if your B12 is already low.','使B12失活——如果B12本来就偏低，影响更大。',['COB','METH'],['B12','B9'],'Tell your dentist or doctor if you are low in B12 and ask about alternatives; never change treatment without their advice.','如果B12偏低，请告知牙医或医生并询问替代方案；未经医嘱切勿自行改变治疗。'],
['L','Chronic stress','长期压力','Work pressure, constant “on” mode, unresolved emotional load.','工作压力、长期“绷紧”状态、未化解的情绪负担。','Drains methyl nutrients, B5 and magnesium, and speeds up the breakdown of stress chemicals (COMT).','消耗甲基营养素、B5和镁，并加快压力化学物质的分解（COMT）。',['METH','CAT','EST'],['B5','Mg','B6','B12'],'Build a daily wind-down — breathing, nature, gentle movement — and protect your sleep.','建立每日放松习惯——呼吸练习、亲近自然、温和运动——并守护睡眠。'],
['L','Poor sleep & sleep apnea','睡眠不足与睡眠呼吸暂停','Late screens, noisy or bright bedrooms, snoring, shift work.','深夜看屏幕、嘈杂或明亮的卧室、打鼾、轮班工作。','Raises oxidative stress and drains glutathione.','增加氧化压力，消耗谷胱甘肽。',['GSH','MIT'],['Mg','Se'],'Keep a fixed bedtime in a dark, cool room, and ask about snoring or apnea.','固定作息，卧室保持黑暗凉爽；如有打鼾或呼吸暂停，请就医评估。'],
['L','Alcohol & caffeine','酒精与咖啡因','Wine, spirits, beer, coffee, tea, energy drinks, nicotine.','葡萄酒、烈酒、啤酒、咖啡、茶、能量饮料、尼古丁。','Slow aldehyde clearance and deplete B1, B2, B3, B6, B12, C, magnesium and zinc.','减慢醛类清除，并消耗B1、B2、B3、B6、B12、C、镁和锌。',['ALD','HIS','GSH'],['B1','B2','B3','B6','Mg','Zn'],'Cut back or space them out, and drink water alongside.','减少用量或拉开间隔，并多喝水。'],
['L','Ultra-processed food & seed oils','超加工食品与种子油','Packaged snacks, fried takeaway, margarine, refined oils (soy, corn, sunflower, canola).','包装零食、油炸外卖、人造黄油、精炼油（大豆油、玉米油、葵花籽油、菜籽油）。','A pro-inflammatory omega-6 load; rancid or overheated oils deplete glutathione and add oxidative stress.','带来促炎的ω-6负担；变质或过热的油会消耗谷胱甘肽并增加氧化压力。',['GSH'],['Se','C'],'Stick to whole foods, cook with ghee, butter or avocado oil, and keep seed oils out of the pan.','以天然完整食物为主，用酥油、黄油或牛油果油烹饪，避免使用种子油。'],
['L','Over-training','过度训练','Daily high-intensity sessions without recovery.','每天高强度训练、缺乏恢复。','Raises oxidative stress and drains glutathione, B vitamins and magnesium.','增加氧化压力，消耗谷胱甘肽、B族维生素和镁。',['GSH','MIT'],['Mg','B2','Se'],'Train hard enough to adapt, not to burn out — plan rest days.','训练强度以促进适应为度，不要练到透支——安排休息日。'],
['L','Gut imbalance','肠道失衡','Antibiotics, low stomach acid, infections, poor digestion.','抗生素、胃酸不足、感染、消化不良。','Drains B12, folate and B6, raises histamine and shunts tryptophan away from serotonin.','消耗B12、叶酸和B6，升高组胺，并使色氨酸偏离血清素合成。',['HIS','SER','COB','FOL'],['B12','B9','B6','Fe','Zn'],'Treat infections and dysbiosis with your practitioner, and support digestion — chew well and eat in a relaxed state.','与营养师一起处理感染和菌群失衡，并支持消化——细嚼慢咽，放松进食。']];

<div id="bkform"><div class="eyebrow">${U('bkE')}</div><h3>${U('bkT')}</h3><div class="sb">${U('bkS')}</div>

${(sel.size||symSel.size)?`<label class="ck"><input type="checkbox" id="bk-inc" checked><span>${U('inc')}</span></label>`:''}
<div id="bk-st" style="display:none" class="bst"></div>

if(sel.size){const d=calc();L.push('Nutrients flagged (level): '+[...sel].map(i=>byId[i].n[0]+' ('+UI.lv[lv(i)][0]+')').join(', '));L.push('Most affected systems: '+d.sysS.slice(0,4).map(a=>a.s.n[0]+' - '+UI.bands[band(a.v)[0]][0]).join(', '))}return L.join('\n')}
